services:
  - type: web
    name: iso-server
    runtime: docker
    branch: main
    plan: starter
    region: frankfurt
    dockerContext: .
    dockerfilePath: ./server/Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: production
      - key: DB_PATH
        value: /app/server/db/data.db
      - key: UPLOAD_DIR
        value: /data/uploads
      - key: CLIENT_ORIGIN
        fromService:
          type: web
          name: iso-client
          envVarKey: RENDER_EXTERNAL_URL
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        value: El torneo de los magos
    disk:
      name: iso-data
      mountPath: /data
      sizeGB: 1

  - type: web
    name: iso-client
    runtime: docker
    branch: main
    plan: free
    region: frankfurt
    dockerContext: ./client
    dockerfilePath: ./client/Dockerfile
    healthCheckPath: /
    envVars:
      - key: SERVER_URL
        fromService:
          type: web
          name: iso-server
          envVarKey: RENDER_EXTERNAL_URL
